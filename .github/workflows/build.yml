name: Build APK

on:
  push:
    branches: [ "main", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project
      run: |
        unzip -o *.zip
        find . -name "gradlew" -exec chmod +x {} +

    - name: Build Debug APK
      run: |
        BUILD_DIR=$(find . -name "gradlew" -printf "%h\n" | head -n 1)
        if [ -n "$BUILD_DIR" ]; then
          cd "$BUILD_DIR"
          ./gradlew assembleDebug
        else
          echo "Gradlew not found" && exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: App-APK
        path: "**/build/outputs/apk/debug/*.apk"
