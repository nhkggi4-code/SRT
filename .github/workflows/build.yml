name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # هذه الخطوة الجديدة ستساعدنا في معرفة أسماء الملفات الدقيقة
      - name: List files (Debugging)
        run: ls -la

      - name: Unzip project
        run: |
          if [ -f "hhhhhhhh00it45dfgy.zip" ]; then
            unzip "hhhhhhhh00it45dfgy.zip" -d android_project
          else
            echo "Error: The zip file was not found! Please check the file name in the 'List files' step."
            exit 1
          fi

      - name: Generate Gradle Wrapper
        run: |
          cd android_project
          gradle wrapper

      - name: Make gradlew executable
        run: |
          cd android_project
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android_project
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
