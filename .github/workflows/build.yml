name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip project
        run: |
          unzip hhhhhhhh00it45dfgy.zip -d android_project 

      - name: Generate Gradle Wrapper
        run: |
          cd android_project
          gradle wrapper

      - name: Make gradlew executable
        run: |
          cd android_project
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android_project
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
