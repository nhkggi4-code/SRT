name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # هذه الخطوة ستبحث عن الملف وتقوم بفك ضغطه أينما كان
      - name: Find and Unzip project
        run: |
          ZIP_FILE=$(find . -name "hhhhhhhh00it45dfgy.zip" -type f | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: Could not find the zip file anywhere."
            exit 1
          fi
          
          echo "Found zip file at: $ZIP_FILE"
          unzip "$ZIP_FILE" -d android_project

      - name: Fix Directory Structure (If Needed)
        run: |
          if [ ! -f "android_project/build.gradle.kts" ] && [ ! -f "android_project/build.gradle" ]; then
            echo "Moving files from subfolder to android_project root..."
            mv android_project/*/* android_project/ 2>/dev/null || true
          fi

      - name: Generate Gradle Wrapper
        run: |
          cd android_project
          gradle wrapper

      - name: Make gradlew executable
        run: |
          cd android_project
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android_project
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
