name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # الحل الأقوى: البحث عن أي ملف مضغوط وفك ضغطه متجاهلين الاسم
      - name: Find and Unzip ANY zip file
        run: |
          ZIP_FILE=$(find . -name "*.zip" -type f | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No .zip files found at all!"
            ls -laR
            exit 1
          fi
          
          echo "Found a zip file: $ZIP_FILE. Extracting it now..."
          unzip "$ZIP_FILE" -d android_project

      - name: Fix Directory Structure
        run: |
          if [ ! -f "android_project/build.gradle.kts" ] && [ ! -f "android_project/build.gradle" ]; then
            echo "Moving files from subfolder..."
            mv android_project/*/* android_project/ 2>/dev/null || true
          fi

      - name: Generate Gradle Wrapper
        run: |
          cd android_project
          gradle wrapper

      - name: Make gradlew executable
        run: |
          cd android_project
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android_project
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
